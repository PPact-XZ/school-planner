<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {# csrf_token is minted at login (P3); the meta tag is read by mutating fetches. #}
  <meta name="csrf-token" content="{{ csrf_token | default('') }}" />
  <title>{% block title %}School Planner{% endblock %}</title>
  {# Tailwind CLI build output, committed — no Play CDN in production (§3.5). #}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  {% block navbar %}{% endblock %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
